[project]
name = "reportory-api"
version = "0.1.0"
description = "re:portory API 서버와 워커"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "tenacity>=9.0",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.34",
  "pdfplumber>=0.11.11",
  "python-docx>=1.2.0",
  "jinja2>=3.1.6",
  "playwright>=1.65.2",
  "tzdata>=2026.6",
  "anthropic>=2.13.0",
  "trafilatura>=2.0",
]

[dependency-groups]
dev = [
  "asyncpg>=0.32.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # 줄 길이는 ruff format이 맞추고, SQL 문자열은 예외로 둔다
